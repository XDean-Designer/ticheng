<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提成设置 v2.0 · 拍板问卷（临时）</title>
<style>
:root {
  --brand: #F32F41;
  --brand-soft: #FFF2F2;
  --text: #1A1A1A;
  --text-sec: #646A73;
  --border: #E5E6EB;
  --bg: #F5F6F7;
  --card: #fff;
  --rec: #E8F8F2;
  --rec-border: #2BA471;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 15px;
  padding-bottom: 120px;
}
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.topbar h1 { font-size: 16px; font-weight: 650; }
.topbar__hint { font-size: 12px; color: var(--text-sec); font-weight: 400; margin-left: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; color: var(--text);
}
.btn:active { opacity: .85; }
.btn--primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn--ghost { background: var(--brand-soft); color: var(--brand); border-color: #FFD5D9; }
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
.intro {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 20px; font-size: 14px; color: var(--text-sec);
}
.intro strong { color: var(--text); }
.section {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 18px 18px 8px; margin-bottom: 16px;
}
.section__title {
  font-size: 15px; font-weight: 650; margin-bottom: 4px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.section__desc { font-size: 12px; color: var(--text-sec); margin-bottom: 14px; }
.q {
  padding: 14px 0; border-bottom: 1px solid #F0F0F0;
}
.q:last-child { border-bottom: none; }
.q__id {
  display: inline-block; font-size: 11px; font-weight: 700; color: var(--brand);
  background: var(--brand-soft); padding: 2px 7px; border-radius: 4px; margin-bottom: 6px;
}
.q__text { font-size: 14px; font-weight: 550; margin-bottom: 10px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
  cursor: pointer; transition: border-color .15s, background .15s;
  user-select: none;
}
.opt:hover { border-color: #FFD5D9; background: #FFFAFA; }
.opt.is-selected {
  border-color: var(--brand);
  background: var(--brand-soft);
}
.opt.is-rec:not(.is-selected) { border-color: #C9E8D9; background: #FAFDFB; }
.opt__radio {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid #C9CDD4; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
}
.opt.is-selected .opt__radio {
  border-color: var(--brand); background: var(--brand);
}
.opt.is-selected .opt__radio::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff;
}
.opt__body { flex: 1; min-width: 0; }
.opt__label { font-size: 13px; font-weight: 600; color: var(--text); }
.opt__label code {
  font-size: 12px; background: #F2F3F5; padding: 1px 5px; border-radius: 4px;
  font-weight: 500;
}
.opt__desc { font-size: 12px; color: var(--text-sec); margin-top: 3px; }
.badge-rec {
  display: inline-block; font-size: 10px; font-weight: 600; color: var(--rec-border);
  background: var(--rec); padding: 1px 6px; border-radius: 4px; margin-left: 6px;
  vertical-align: middle;
}
.sticky-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.progress { font-size: 13px; color: var(--text-sec); }
.progress strong { color: var(--brand); }
.output-wrap {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-top: 8px;
}
.output-wrap h3 { font-size: 14px; margin-bottom: 10px; }
.output {
  width: 100%; min-height: 88px; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  resize: vertical; background: #FAFBFC; color: var(--text);
}
.toast {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,.78); color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 14px; z-index: 100; pointer-events: none; opacity: 0;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>提成设置 v2.0<span class="topbar__hint">拍板问卷 · 临时页</span></h1>
  </div>
  <div class="actions">
    <button type="button" class="btn btn--ghost" id="btnDefault">一键选推荐默认</button>
    <button type="button" class="btn btn--primary" id="btnCopy">复制答案</button>
  </div>
</div>

<div class="wrap">
  <div class="intro">
    请逐题点选。选完后点底部 <strong>「复制答案」</strong>，粘贴回对话即可。
    也可点 <strong>「一键选推荐默认」</strong> 快速填充建议组合，再按需微调。
  </div>

  <div id="questionnaire"></div>

  <div class="output-wrap">
    <h3>当前答案（实时生成）</h3>
    <textarea class="output" id="output" readonly></textarea>
  </div>
</div>

<div class="sticky-foot">
  <div class="progress">已答 <strong id="answered">0</strong> / <strong id="total">0</strong></div>
  <button type="button" class="btn btn--primary" id="btnCopy2">复制答案</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var QUESTIONS = [
    {
      section: 'A · 删除「经理签单计算提成」列表开关',
      sectionDesc: '方案列表卡片第二行 switch 将移除',
      items: [
        {
          id: 'A1',
          text: '删除列表 UI 后，signComm 字段与计提逻辑怎么处理？',
          options: [
            { id: 'a', rec: true, label: 'A1-a', title: '删 UI + 删字段 + 删试算经理签单行', desc: '经理签单订单永远不计提成（不在三类 payScope 内）' },
            { id: 'b', label: 'A1-b', title: '删 UI，保留字段默认 false 及引擎逻辑', desc: '以后可能从别处配置' },
            { id: 'c', label: 'A1-c', title: '删列表开关，改到方案编辑页统一设置', desc: '需另行指定入口位置' }
          ]
        },
        {
          id: 'A2',
          text: 'PRD / 验收里 v1.8 的 signComm 相关用例（51–54、规则 29 等）？',
          options: [
            { id: 'a', rec: true, label: 'A2-a', title: '全部删除并重写口径', desc: '' },
            { id: 'b', label: 'A2-b', title: '保留规则 29，仅删列表 UI 描述', desc: '' }
          ]
        }
      ]
    },
    {
      section: 'B · 规则卡 UI（方案编辑页）',
      sectionDesc: '右列加「基数」「范围」标签；删发丝线；范围换新控件',
      items: [
        {
          id: 'B1',
          text: '右列字段名「基数」「范围」样式？',
          options: [
            { id: 'a', rec: true, label: 'B1-a', title: '10px、#929292，控件上方左对齐', desc: '' },
            { id: 'b', label: 'B1-b', title: '11px、与标题同列左对齐', desc: '控件仍右对齐' }
          ]
        },
        {
          id: 'B2',
          text: '「范围」新控件形态？（需与基数段控明显不同、便于多选）',
          options: [
            { id: 'a', rec: true, label: 'B2-a', title: '独立圆角 chip 多选', desc: '每 chip 独立边框；选中品牌色描边 + 浅粉底' },
            { id: 'b', label: 'B2-b', title: '带勾选框的三行列表', desc: '现金 / 卡付 / 团购 各占一行' },
            { id: 'c', label: 'B2-c', title: '保持连体胶囊', desc: '仅用颜色区分（橙色系基数 / 品牌色范围）' }
          ]
        },
        {
          id: 'B3',
          text: '卡面上「基数」「范围」是否仍可直改（不打开 Sheet）？',
          options: [
            { id: 'a', rec: true, label: 'B3-a', title: '保留卡面直改', desc: '与现逻辑一致' },
            { id: 'b', label: 'B3-b', title: '卡面只展示', desc: '必须点标题进 Sheet 才能改' }
          ]
        },
        {
          id: 'B4',
          text: '固定金额时，「基数」区显示？',
          options: [
            { id: 'a', rec: true, label: 'B4-a', title: '仍显示「固定」灰标', desc: '与现逻辑一致' },
            { id: 'b', label: 'B4-b', title: '隐藏基数区', desc: '仅显示范围' }
          ]
        }
      ]
    },
    {
      section: 'C · Sheet 拆分（标题 vs 提成参数）',
      sectionDesc: '点标题 = 全量 Sheet；点参数区 = 不含范围/基数',
      items: [
        {
          id: 'C1',
          text: '点标题 → Sheet 内容？',
          options: [
            { id: 'a', rec: true, label: 'C1-a', title: '全量 Sheet', desc: '范围 + 基数 + 分配模式 + 提成取值 + 点客/散客 + 工位 + 会员卡（覆盖时）' },
            { id: 'b', label: 'C1-b', title: '其他', desc: '请在复制答案后补充说明' }
          ]
        },
        {
          id: 'C2',
          text: '点提成参数区 → Sheet 排除范围与基数，保留哪些？',
          options: [
            { id: 'a', rec: true, label: 'C2-a', title: '分配模式 + 提成取值 + 点客/散客 + 工位 + 会员卡', desc: '覆盖卡时含办卡/充卡' },
            { id: 'b', label: 'C2-b', title: '仅提成取值 + 点客/散客', desc: '不含分配模式、不含工位设置入口' },
            { id: 'c', label: 'C2-c', title: '自定义', desc: '请在复制答案后补充字段列表' }
          ]
        },
        {
          id: 'C3',
          text: '「添加规则项 · 设置」Sheet（选完项目后）？',
          options: [
            { id: 'a', rec: true, label: 'C3-a', title: '仍为全量', desc: '含范围、基数，与标题 Sheet 一致' },
            { id: 'b', label: 'C3-b', title: '与参数 Sheet 一致', desc: '不含范围、基数' }
          ]
        },
        {
          id: 'C4',
          text: '参数 Sheet 打开时是否自动滚动到「提成参数」段？',
          options: [
            { id: 'a', rec: true, label: 'C4-a', title: '是', desc: '顶栏即参数区' },
            { id: 'b', label: 'C4-b', title: '否', desc: '从 Sheet 顶部展示' }
          ]
        }
      ]
    },
    {
      section: 'D · 模块 13 · 迁移重大改动',
      sectionDesc: '不追求金额完全一致，必须落成新规则卡',
      items: [
        {
          id: 'D1',
          text: '新迁移总目标？',
          options: [
            { id: 'a', rec: true, label: 'D1-a', title: '结构必迁、金额不要求一致', desc: '差异出报告，不阻断上线' },
            { id: 'b', label: 'D1-b', title: '结构必迁 + 抽样对比报告', desc: '仅告警不阻断' },
            { id: 'c', label: 'D1-c', title: '仍要求层 A–D 等价校验全过', desc: '与「不追求一致」冲突' }
          ]
        },
        {
          id: 'D2',
          text: '旧 cost + achPct 新模型无对应字段，怎么迁？',
          options: [
            { id: 'a', rec: true, label: 'D2-a', title: '丢弃 cost/achPct', desc: '能直写的写 baseMode+rate；其余 override 取旧 comm 原值（不折叠）' },
            { id: 'b', label: 'D2-b', title: '仍用快照价 P 折叠公式', desc: '不保证迁移前后金额一致' },
            { id: 'c', label: 'D2-c', title: 'cost/achPct≠0 不自动生成覆盖', desc: '报告标记需人工补配置' }
          ]
        },
        {
          id: 'D3',
          text: '旧分类「不计算」→ 新规则卡？',
          options: [
            { id: 'a', rec: true, label: 'D3-a', title: 'rate/amount 全 0，payScope 仍三类全开', desc: '' },
            { id: 'b', label: 'D3-b', title: 'payScope 全关 + rate 0', desc: '与「至少选一类」冲突' }
          ]
        },
        {
          id: 'D4',
          text: '充值 / 续次 / 续费（旧三项参数不一致）？',
          options: [
            { id: 'a', rec: true, label: 'D4-a', title: '能识别则拆多条覆盖', desc: '不能识别 → 充卡默认 + 报告，不阻断' },
            { id: 'b', label: 'D4-b', title: '取三者最大值写入充卡默认', desc: '简单但有偏差' },
            { id: 'c', label: 'D4-c', title: '仍 needs_review 阻断该门店', desc: '旧 PRD 逻辑' }
          ]
        },
        {
          id: 'D5',
          text: '商城 / 赠金耗卡 / 赠送服务 / 抵用券等特殊项？',
          options: [
            { id: 'a', rec: true, label: 'D5-a', title: '最近似分类写入 + 报告', desc: '无法识别则跳过' },
            { id: 'b', label: 'D5-b', title: '全部跳过', desc: '报告人工配置' },
            { id: 'c', label: 'D5-c', title: '仍阻断 needs_review', desc: '' }
          ]
        },
        {
          id: 'D6',
          text: '旧 payScope.sign（经理签单参与计提）迁移？',
          options: [
            { id: 'a', rec: true, label: 'D6-a', title: '忽略', desc: '迁移后经理签单统一不计提成' },
            { id: 'b', label: 'D6-b', title: '保留 signComm 字段逻辑', desc: '与删列表 signComm 可能冲突' },
            { id: 'c', label: 'D6-c', title: '旧 sign=true 仅出报告', desc: '提示需人工确认' }
          ]
        },
        {
          id: 'D7',
          text: '阶梯提成方案？',
          options: [
            { id: 'a', rec: true, label: 'D7-a', title: '不迁入新模型', desc: '旧引擎继续；新列表只读展示' },
            { id: 'b', label: 'D7-b', title: '阶梯也强制转成新方案卡', desc: '与旧引擎冲突' }
          ]
        },
        {
          id: 'D8',
          text: '多套旧「单项提成」→ 新 Scheme？',
          options: [
            { id: 'a', rec: true, label: 'D8-a', title: '一套旧方案 → 一张新方案卡', desc: '员工归属保留' },
            { id: 'b', label: 'D8-b', title: '按员工合并', desc: '同参数才合并' }
          ]
        },
        {
          id: 'D9',
          text: '迁移后旧配置入口 / 回滚？',
          options: [
            { id: 'a', rec: true, label: 'D9-a', title: '下线旧入口；保留回滚开关', desc: '默认切新引擎' },
            { id: 'b', label: 'D9-b', title: '灰度双写 7 天再切', desc: '' },
            { id: 'c', label: 'D9-c', title: '无回滚，一切新引擎', desc: '' }
          ]
        },
        {
          id: 'D10',
          text: '模块 13 层 A–E 等价校验？',
          options: [
            { id: 'a', rec: true, label: 'D10-a', title: '删除金额门禁', desc: '改为结构校验 + 迁移报告' },
            { id: 'b', label: 'D10-b', title: '保留层 D（阶梯）+ 结构校验', desc: '删 A/B/C 金额回放' },
            { id: 'c', label: 'D10-c', title: '全部保留', desc: '与 D1-a 矛盾' }
          ]
        }
      ]
    },
    {
      section: 'E · PRD 同步',
      sectionDesc: '',
      items: [
        {
          id: 'E1',
          text: '版本号？',
          options: [
            { id: 'a', rec: true, label: 'E1-a', title: 'v2.0', desc: '规则卡 UI + Sheet 拆分 + 删 signComm + 迁移重写' },
            { id: 'b', label: 'E1-b', title: 'v1.10 增量', desc: '' }
          ]
        },
        {
          id: 'E2',
          text: '§6.2 规则卡规格？',
          options: [
            { id: 'a', rec: true, label: 'E1-a', title: '整节重写对齐新 UI', desc: '删除旧版式描述' },
            { id: 'b', label: 'E2-b', title: '仅增补', desc: '保留旧版式描述' }
          ]
        }
      ]
    }
  ];

  /* fix E2 option labels typo */
  QUESTIONS[4].items[1].options[0].label = 'E2-a';

  var answers = {};
  var root = document.getElementById('questionnaire');
  var output = document.getElementById('output');
  var answeredEl = document.getElementById('answered');
  var totalEl = document.getElementById('total');
  var toast = document.getElementById('toast');
  var totalCount = 0;

  QUESTIONS.forEach(function (sec) {
    totalCount += sec.items.length;
    var secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.innerHTML =
      '<div class="section__title">' + sec.section + '</div>' +
      (sec.sectionDesc ? '<div class="section__desc">' + sec.sectionDesc + '</div>' : '');
    sec.items.forEach(function (q) {
      var qEl = document.createElement('div');
      qEl.className = 'q';
      qEl.dataset.qid = q.id;
      var optsHtml = q.options.map(function (o) {
        return (
          '<div class="opt' + (o.rec ? ' is-rec' : '') + '" data-qid="' + q.id + '" data-oid="' + o.id + '" role="radio" aria-checked="false" tabindex="0">' +
          '<span class="opt__radio" aria-hidden="true"></span>' +
          '<div class="opt__body">' +
          '<div class="opt__label"><code>' + o.label + '</code>' + o.title +
          (o.rec ? '<span class="badge-rec">推荐</span>' : '') + '</div>' +
          (o.desc ? '<div class="opt__desc">' + o.desc + '</div>' : '') +
          '</div></div>'
        );
      }).join('');
      qEl.innerHTML =
        '<div class="q__id">' + q.id + '</div>' +
        '<div class="q__text">' + q.text + '</div>' +
        '<div class="opts">' + optsHtml + '</div>';
      secEl.appendChild(qEl);
    });
    root.appendChild(secEl);
  });
  totalEl.textContent = totalCount;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function updateOutput() {
    var keys = Object.keys(answers).sort();
    var lines = keys.map(function (k) { return k + '-' + answers[k]; });
    var compact = lines.join(' ');
    output.value = compact + '\n\n【拍板问卷 v2.0】\n' + lines.join('\n') +
      '\n\n（可直接粘贴回对话；若有 C1-b / C2-c / A1-c 等需补充说明的选项，请在下方追加文字）';
    answeredEl.textContent = keys.length;
  }

  function selectOption(qid, oid) {
    answers[qid] = oid;
    var qEl = root.querySelector('.q[data-qid="' + qid + '"]');
    if (!qEl) return;
    qEl.querySelectorAll('.opt').forEach(function (el) {
      var on = el.dataset.oid === oid;
      el.classList.toggle('is-selected', on);
      el.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    updateOutput();
  }

  root.addEventListener('click', function (e) {
    var opt = e.target.closest('.opt');
    if (!opt) return;
    selectOption(opt.dataset.qid, opt.dataset.oid);
  });

  root.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var opt = e.target.closest('.opt');
    if (!opt) return;
    e.preventDefault();
    selectOption(opt.dataset.qid, opt.dataset.oid);
  });

  function applyDefaults() {
    QUESTIONS.forEach(function (sec) {
      sec.items.forEach(function (q) {
        var rec = q.options.find(function (o) { return o.rec; });
        if (rec) selectOption(q.id, rec.id);
      });
    });
    showToast('已填充推荐默认');
  }

  function copyAnswers() {
    var keys = Object.keys(answers);
    if (keys.length < totalCount) {
      showToast('还有 ' + (totalCount - keys.length) + ' 题未答');
    }
    output.select();
    output.setSelectionRange(0, output.value.length);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(output.value.split('\n\n【拍板问卷')[0].trim()).then(function () {
        showToast(keys.length >= totalCount ? '已复制全部答案' : '已复制（尚有未答题）');
      }).catch(fallbackCopy);
    } else fallbackCopy();
  }

  function fallbackCopy() {
    try {
      document.execCommand('copy');
      showToast('已复制');
    } catch (err) {
      showToast('请手动复制文本框内容');
    }
  }

  document.getElementById('btnDefault').addEventListener('click', applyDefaults);
  document.getElementById('btnCopy').addEventListener('click', copyAnswers);
  document.getElementById('btnCopy2').addEventListener('click', copyAnswers);
  updateOutput();
})();
</script>
</body>
</html>
